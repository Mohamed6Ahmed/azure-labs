n2. In the list of databases, select the **AZ500LabDb** entry. \n\n3. On the **AZ500LabDb** SQL database blade, in the **Security** section, click **Data Discovery & Classification**.\n\n4. On the **Data Discovery & Classification** blade, click the **Classification** tab.\n\n    >**Note**: The classification engine scans your database for columns containing potentially sensitive data and provides a list of recommended column classifications.\n\n5. Click the text message **We have found 15 columns with classification recommendations** displayed on blue bar at the top of the blade.\n\n6. Review the listed columns and the recommended sensitivity label. \n\n7. Enable the **Select all** checkbox and then click **Accept Selected Recommendations**.\n\n    >**Note**: Alternatively, you could select only certain columns and dismiss others. \n\n    >**Note**: You have the option to change the information type and sensitivity label. \n\n8. Once you have completed your review click **Save**. \n\n    >**Note**: This will complete the classification and persistently label the database columns with the new classification metadata. \n\n9. Back on the **Data Discovery & Classification** blade **Overview** tab, note that it has been updated to account for the latest classification information. \n\n#### Task 4 : Configure auditing \n\nIn this task, you will first configure server level auditing and then configure database level auditing. \n\n1. In the Azure portal, navigate back to the SQL Server blade.\n\n2. On the SQL Server blade, in the **Security** section, click **Auditing**.\n\n    >**Note**: This is server level auditing. The default auditing settings include all the queries and stored procedures executed against the database, as well as successful and failed logins.\n\n3. Set the **Enable Azure SQL Auditing** switch to **ON** to enable auditing. \n\n4. Select the **Storage** checkbox and entry boxes for **Subscription** and **Storage Account** will display.\n\n5. Choose your **Subscription** from the dropdown list.\n\n6. Click **Storage account** and choose **Create new**.\n\n7. On the **Create storage account** blade, in the **Name** box, type a globally unique name consisting of between 3 and 24 lower case letters and digits, click **OK**, \n\n    >**Note**: You may need to refresh the browser before the storage account becomes available.\n\n8. Back on the **Auditing** blade, under **Advanced properties** set **Retention (days)** to **5**. \n\n9. On the Auditing blade, click **Save** to save the auditing settings. \n\n    >**Note**: If you receive an error message regarding invalid storage container path then the storage account may not have have been provisioned yet. Wait a few minutes, click **Storage account**, on the **Choose storage account** blade, select the newly created storage account and back on the Auditing blade, click **Save**.\n\n10. On the server blade, in the **Settings** section, click **SQL Databases**.\n\n11. In the list of databases, select the **AZ500LabDb** entry. \n\n12. On the **AZ500LabDb** SQL database blade, in the **Security** section, click **Auditing**. \n\n    >**Note**: This is database level auditing. Server-level auditing is already enabled. \n  \n    >**Note**: Audits can be written to an Azure storage account, to a Log Analytics workspace, or to the Event Hub. You can configure any combination of these options.\n\n    >**Note**: If storage-based auditing is enabled on the server, it will always apply to the database, regardless of the database settings.\n13. On your SQL database Overview page in the Azure portal, select **Query editor (preview)** from the left menu. Try to sign in, you might fail on password, firewall rule for your IP address, everything gets audited. Try successful login as well, run query and you might find more details in audit logs\n\n14. switch back to DB, Auditing and Click **View Audit Logs**.\n\n15. On the **Audit records** blade, note that you can switch between Server audit and Database audit. \n\n> Results: You have created a SQL server and database, configured data classification, and auditing. \n\n\n**Clean up resources**\n\n> Remember to remove any newly created Azure resources that you no longer use. Removing unused resources ensures you will not incur unexpected costs. \n\n1. In the Azure portal, open the Cloud Shell by clicking the first icon in the top right of the Azure Portal. If prompted, click **PowerShell** and **Create storage**.\n\n2. Ensure **PowerShell** is selected in the drop-down menu in the upper-left corner of the Cloud Shell pane.\n\n3. In the PowerShell session within the Cloud Shell pane, run the following to remove the resource group you created in this lab:\n  \n    ```powershell\n    Remove-AzResourceGroup -Name \"AZ500LAB11\" -Force -AsJob\n    ```\n4. Close the **Cloud Shell** pane. \n"}, {"file": "LAB_06_SecuringAzureStorage.MD", "num": 6, "title": " 06 - Service Endpoints and Securing Storage", "module": "Module 03 - Plan and implement security for Azure SQL Database and Azure SQL Managed Instance", "body": "# Lab 06: Service Endpoints and Securing Storage\n# Student lab manual\n\n## Lab scenario\n\nYou have been asked to create a proof of concept to demonstrate securing Azure file shares. Specifically, you want to:\n\t\n- Create a storage endpoint so traffic destined to Azure Storage always stays within the Azure backbone network.\n- Configure the storage endpoint so only resources from a specific subnet can access the storage.\n- Confirm that resources outside of the specific subnet cannot access the storage. \n\n> For all the resources in this lab, we are using the **East US** region. Verify with your instructor this is the region to use for class. \n\n## Lab objectives\n\nIn this lab, you will complete the following exercise:\n\n- Exercise 1: Service endpoints and security storage\n\n## Service Endpoints and Securing Storage diagram\n\n![Diagram showing the process flow of tasks in the lab.](media/service-endpoints-and-securing-storage-diagram.png)\n\n## Instructions\n\n### Exercise 1: Service endpoints and security storage\n\n### Estimated timing: 45 minutes\n\nIn this exercise, you will complete the following tasks:\n\n- Task 1: Create a virtual network\n- Task 2: Add a subnet to the virtual network and configure a storage endpoint\n- Task 3: Configure a network security group to restrict access to the subnet\n- Task 4: Configure a network security group to allow rdp on the public subnet\n- Task 5: Create a storage account with a file share\n- Task 6: Deploy virtual machines into the designated subnets\n- Task 7: Test the storage connection from the private subnet to confirm that access is allowed\n- Task 8: Test the storage connection from the public subnet to confirm that access is denied \n\n#### Task 1: Create a virtual network\n\nIn this task, you will create a virtual network.\n\n1. Sign-in to the Azure portal **`https://portal.azure.com/`**.\n\n    >**Note**: Sign in to the Azure portal using an account that has the Owner or Contributor role in the Azure subscription you are using for this lab.\n\n2. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Virtual networks** and press the **Enter** key.\n\n3. On the **Virtual Networks** blade, click **+ Create**.\n\n4. On the **Basics** tab of the **Create virtual network** blade, specify the following settings (leave others with their default values) and click **Next: IP Addresses**:\n\n    |Setting|Value|\n    |---|---|\n    |Subscription|the name of the Azure subscription you are using in this lab|\n    |Resource group|click **Create new** and type the name **AZ500LAB12**|\n    |Name|**myVirtualNetwork**|\n    |Region|**(US) East US**|\n\n5. On the **IP addresses** tab of the **Create virtual network** blade, set the **IPv4 address space** to **10.0.0.0/16**, in the **Subnet name** column, click **default** and, on the **Edit subnet** blade, specify the following settings and click **Save**:\n\n    |Setting|Value|\n    |---|---|\n    |Subnet name|**Public**|\n    |Subnet address range|**10.0.0.0/24**|\n\n6. Back on the **IP addresses** tab of the **Create virtual network** blade, click **Review + create**.\n\n7. On the **Review + create** tab of the **Create virtual network** blade, click **Create**.\n\n#### Task 2: Add a subnet to the virtual network and configure a storage endpoint\n\nIn this task, you will create another subnet and enable a service endpoint on that subnet. Service endpoints are enabled per service, per subnet. \n\n1. In the Azure portal, navigate back to the **Virtual Networks** blade.\n\n2. On the **Virtual networks** blade, click the **myVirtualNetwork** entry.\n\n3. On the **myVirtualNetwork** blade, in the **Settings** section, click **Subnets**.\n\n4. On the **myVirtualNetwork \\| Subnets** blade, click **+ Subnet**. \n\n5. On the **Add subnet** blade, specify the following settings (leave others with their default values):\n\n    |Setting|Value|\n    |---|---|\n    |Subnet name|**Private**|\n    |Subnet address range|**10.0.1.0/24**|\n    |Service endpoints|**Leave the default of None**|\n\n6. On the **Add subnet** blade, click **Add**.\n\n    >**Note**: The virtual network now has two subnets: Public and Private. \n\t\n#### Task 3: Configure a network security group to restrict access to the subnet\n\nIn this task, you will create a network security group with two outbound security rules (Storage and internet) and one inbound security rule (RDP). You will also associate the network security group with the Private subnet. This will restrict outbound traffic from Azure VMs connected to that subnet.\n\n1. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Network security groups** and press the **Enter** key.\n\n2. On the **Network security groups** blade, click **+ Create**.\n\n3. On the **Basics** tab of the **Create network security group** blade, specify the following settings: \n\n    |Setting|Value|\n    |---|---|\n    |Subscription|the name of the Azure subscription you are using in this lab|\n    |Resource group|**AZ500LAB12**|\n    |Name|**myNsgPrivate**|\n    |Region|**East US**|\n\n4. Click **Review + create** and then click **Create**.\n\n    >**Note**: In the next steps, you will create an outbound security rule that allows communication to the Azure Storage service. \n\n5. In the Azure portal, navigate back to the **Network security groups** blade and click the **myNsgPrivate** entry.\n\n6. On the **myNsgPrivate** blade, in the **Settings** section, click **Outbound security rules**.\n\n7. On the **myNsgPrivate \\| Outbound security rules** blade, click **+ Add**.\n\n8. On the **Add outbound security rule** blade, specify the following settings to explicitly allow outbound traffic to Azure Storage (leave all other values with their default settings): \n\n    |Setting|Value|\n    |---|---|\n    |Source|**Service Tag**|\n    |Source service tag|**VirtualNetwork**|\n    |Source port ranges|**\\***|\n    |Destination|**Service Tag**|\n    |Destination service tag|**Storage**|\n    |Destination port ranges|**\\***|\n    |Protocol|**Any**|\n    |Action|**Allow**|\n    |Priority|**1000**|\n    |Name|**Allow-Storage-All**|\n\n9. On the **Add outbound security rule** blade, click **Add** to create the new outbound rule. \n\n10. On the **myNsgPrivate** blade, in the **Settings** section, click **Outbound security rules**, and then click **+ Add**.\n\n11. On the **Add outbound security rule** blade, specify the following settings to explicitly deny outbound traffic to Internet (leave all other values with their default settings): \n\n    |Setting|Value|\n    |---|---|\n    |Source|**Service Tag**|\n    |Source service tag|**VirtualNetwork**|\n    |Source port ranges|**\\***|\n    |Destination|**Service Tag**|\n    |Destination service tag|**Internet**|\n    |Destination port ranges|**\\***|\n    |Protocol|**Any**|\n    |Action|**Deny**|\n    |Priority|**1100**|\n    |Name|**Deny-Internet-All**|\n\n    >**Note**: This rule overrides a default rule in all network security groups that allows outbound internet communication. \n\n    >**Note**: In the next steps, you will create an inbound security rule that allows Remote Desktop Protocol (RDP) traffic to the subnet. The rule overrides a default security rule that denies all inbound traffic from the internet. Remote Desktop connections are allowed to the subnet so that connectivity can be tested in a later step.\n\n12. On the **myNsgPrivate** blade, in the **Settings** section, click **Inbound security rules** and then click **+ Add**.\n\n13. On the **Add inbound security rule** blade, specify the following settings (leave all other values with their default values): \n\n    |Setting|Value|\n    |---|---|\n    |Source|**Any**|\n    |Source port ranges|**\\***|\n    |Destination|**Service Tag**|\n    |Destination service tag|**VirtualNetwork**|\n    |Destination port ranges|**3389**|\n    |Protocol|**TCP**|\n    |Action|**Allow**|\n    |Priority|**1200**|                                                    \n    |Name|**Allow-RDP-All**|\n\n14. On the **Add inbound security rule** blade, click **Add** to create the new inbound rule. \n\n    >**Note**: Now you will associate the network security group with the Private subnet.\n\n15. On the **Subnets** blade, select **+ Associate** and specify the following settings in the **Associate subnet** section and then click **OK**:\n\n    |Setting|Value|\n    |---|---|\n    |Virtual network|**myVirtualNetwork**|\n    |Subnet|**Private**|\n\n#### Task 4: Configure a network security group to allow rdp on the public subnet\n\nIn this task, you will create a network security group with one inbound security rule (RDP). You will also associate the network security group with the Public subnet. This will allow RDP access to the Public VM.\n\n1. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Network security groups** and press the **Enter** key.\n\n2. On the **Network security groups** blade, click **+ Create**.\n\n3. On the **Basics** tab of the **Create network security group** blade, specify the following settings: \n\n    |Setting|Value|\n    |---|---|\n    |Subscription|the name of the Azure subscription you are using in this lab|\n    |Resource group|**AZ500LAB12**|\n    |Name|**myNsgPublic**|\n    |Region|**East US**|\n\n4. Click **Review + create** and then click **Create**.\n\n    >**Note**: In the next steps, you will create an outbound security rule that allows communication to the Azure Storage service. \n\n5. In the Azure portal, navigate back to the **Network security groups** blade and click the **myNsgPublic** entry.\n\n6. On the **myNsgPublic** blade, in the **Settings** section, click **Inbound security rules** and then click **+ Add**.\n\n7. On the **Add inbound security rule** blade, specify the following settings (leave all other values with their default values): \n\n    |Setting|Value|\n    |---|---|\n    |Source|**Any**|\n    |Source port ranges|**\\***|\n    |Destination|**Service Tag**|\n    |Destination service tag|**VirtualNetwork**|\n    |Destination port ranges|**3389**|\n    |Protocol|**TCP**|\n    |Action|**Allow**|\n    |Priority|**1200**|                                                    \n    |Name|**Allow-RDP-All**|\n\n8. On the **Add inbound security rule** blade, click **Add** to create the new inbound rule. \n\n    >**Note**: Now you will associate the network security group with the Public subnet.\n\n9. On the **Subnets** blade, select **+ Associate** and specify the following settings in the **Associate subnet** section and then click **OK**:\n\n    |Setting|Value|\n    |---|---|\n    |Virtual network|**myVirtualNetwork**|\n    |Subnet|**Public**|\n    \n#### Task 5: Create a storage account with a file share\n\nIn this task, you will create a storage account with a file share and obtain the storage account key.  \n\n1. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Storage accounts** and press the **Enter** key.\n\n2. On the **Storage accounts** blade, click **+ Create**.\n\n3. On the **Basics** tab of the **Create storage account** blade, specify the following settings (leave others with their default values):\n\n    |Setting|Value|\n    |---|---|\n    |Subscription|the name of the Azure subscription you are using in this lab|\n    |Resource group|**AZ500LAB12**|\n    |Storage account name|any globally unique name between 3 and 24 in length consisting of letters and digits|\n    |Location|**(US) EastUS**|\n    |Performance|**Standard (general-purpose v2 account)**|\n    |Redundency|**Locally redundant storage (LRS)**|\n\n4. On the **Basics** tab of the **Create storage account** blade, click **Review + Create**, wait for the validation process to complete, and click **Create**.\n\n    >**Note**: Wait for the Storage account to be created. This should take about 2 minutes.\n\n5. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Resource groups** and press the **Enter** key.\n\n6. On the **Resource groups** blade, in the list of resource group, click the **AZ500LAB12** entry.\n\n7. On the **AZ500LAB12** resource group blade, in the list of resources, click the entry representing the newly created storage account.\n\n8. On the storage account **Overview** blade, click **File Shares** under the **Data storage** tab, and then click **+ File Share**.\n\n9. On the **New file share** blade, untick the **Enable backup** option in the backup tab. \n\n10. On the **New file share** blade, specify the following settings:\n\n    |Setting|Value|\n    |---|---|\n    |Name|**my-file-share**|\n\n11. On the **New file share** blade, click **Create**.\n\n    >**Note**: Now, retrieve and record the PowerShell script that creates a drive mapping to the Azure file share. \n\n12. On the storage account blade, in the list of file shares, click **my-file-share**.\n\n13. On the **my-file-share** blade, click **Connect**.\n\n14. On the **Connect** blade, on the **Windows** tab, copy the PowerShell script that creates a Z drive mapping to the file share. \n\n    >**Note**: Record this script. You will need this in a later in this lab in order to map the file share from the Azure virtual machine on the **Private** subnet.\n\n15. Navigate back to the storage account blade, then in the **Security + networking** section, click **Networking**.\n\n16. Under **Public network access** select **Manage** and as **Default action** select **Enable from selected networks**.\n\n17. Under **Resource settings: Virtual networks, IP adresses, and exceptions** blade, select **view** and click the **+ Add existing virtual network** link. \n\n18. On the **Add networks** blade, specify the following settings:\n\n    |Setting|Value|\n    |---|---|\n    |Subscription|the name of the Azure subscription you are using in this lab|\n    |Virtual networks|**myVirtualNetwork**|\n    |Subnets|**Private**|\n\n19. On the **Add networks** blade, click **Add**. \n\n20. Back on the storage account blade, click **Save**.\n\n    >**Note**: At this point in the lab you have configured a virtual network, a network security group, and a storage account with a file share. \n\n#### Task 6: Deploy virtual machines into the designated subnets\n\nIn this task, you will create two virtual machines one in the Private subnet and one in the Public subnet. \n\n>**Note**: The first virtual machine will be connected to the Private subnet.\n\n1. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Virtual machines** and press the **Enter** key.\n\n2. On the **Virtual machines** blade, click **+ Create** and, in the dropdown list, click **Virtual machine**\n\n3. On the **Basics** tab of the **Create a virtual machine** blade, specify the following settings (leave others with their default values):\n\n    |Setting|Value|\n    |---|---|\n    |Subscription|the name of the Azure subscription you will be using in this lab|\n    |Resource group|**AZ500LAB12**|\n    |Virtual machine name|**myVmPrivate**|\n    |Region|**(US)East US**|\n    |Image|**Windows Server 2022 Datacenter: Azure Edition - Gen 2**|\n    |Username|**Student**|\n    |Password|**Please use your personal password created in Lab 02 > Exercise 2 > Task 1 > Step 3.**|\n    |Public inbound ports|**None**|\n    |Already have a Windows Server license|**Not selected**|\n\n    >**Note**: For public inbound ports, we will rely on the precreated NSG. \n\n4. Click **Next: Disks >** and, on the **Disks** tab of the **Create a virtual machine** blade, set the **OS disk type** to **Standard HDD** and click **Next: Networking >**.\n\n5. Click **Next: Networking >**, on the **Networking** tab of the **Create a virtual machine** blade, specify the following settings (leave others with their default values):\n\n    |Setting|Value|\n    |---|---|\n    |Virtual network|**myVirtualNetwork**|\n    |Subnet|**Private (10.0.1.0/24)**|\n    |Public IP|**(new)myVmPrivate-ip**|\n    |NIC network security group|**None**|\n\n6. Click **Next: Management >**, on the **Management** tab of the **Create a virtual machine** blade, accept the default settings and click **Review + create**.\n\n7. On the **Review + create** blade, ensure that validation was successful and click **Create**.\n\n    >**Note**: The second virtual machine will be connected to the Public subnet.\n\n8. On the **Virtual machines** blade, click **+ Add** and, in the dropdown list, click **Virtual machine**.\n\n9. On the **Basics** tab of the **Create a virtual machine** blade, specify the following settings (leave others with their default values):\n\n    |Setting|Value|\n    |---|---|\n    |Subscription|the name of the Azure subscription you will be using in this lab|\n    |Resource group|**AZ500LAB12**|\n    |Virtual machine name|**myVmPublic**|\n    |Region|**(US)East US**|\n    |Image|**Windows Server 2022 Datacenter: Azure Edition - Gen 2**|\n    |Username|**Student**|\n    |Password|**Please use your personal password created in Lab 02 > Exercise 1 > Task 1 > Step 9.**|\n    |Public inbound ports|**None**|\n    |Already have a Windows Server license|**Not selected**|\n\n    >**Note**: For public inbound ports, we will rely on the precreated NSG. \n\n10. Click **Next: Disks >** and, on the **Disks** tab of the **Create a virtual machine** blade, set the **OS disk type** to **Standard HDD** and click **Next: Networking >**.\n\n11. Click **Next: Networking >**, on the **Networking** tab of the **Create a virtual machine** blade, specify the following settings (leave others with their default values):\n\n    |Setting|Value|\n    |---|---|\n    |Virtual network|**myVirtualNetwork**|\n    |Subnet|**Public (10.0.0.0/24)**|\n    |Public IP|**(new)myVmPublic-ip**|\n    |NIC network security group|**None**|\n\n12. Click **Next: Management >**, on the **Management** tab of the **Create a virtual machine** blade, accept the default settings and click **Review + create**.\n\n13. On the **Review + create** blade, ensure that validation was successful and click **Create**.\n\n    >**Note**: You can continue to the next task once the deployment of the **myVMPublic** Azure VM is completed.\n\n#### Task 7: Test the storage connection from the private subnet to confirm that access is allowed\n\nIn this task, you will connect to the myVMPrivate virtual machine via Remote Desktop and map a drive to the file share. \n\n1. Navigate back to the **Virtual machines** blade. \n\n2. On the **Virtual machines** blade, click the **myVMPrivate** entry.\n\n3. On the **myVMPrivate** blade, click **Connect** and, in the drop down menu, click **Connect**. \n\n4. Download the RDP file and use it to connect to the **myVMPrivate** Azure VM via Remote Desktop. When prompted to authenticate, provide the following credentials:\n\n    |Setting|Value|\n    |---|---|\n    |Username|**Student**|\n    |Password|**Please use your personal password created in Lab 02 > Exercise 2 > Task 1 > Step 3.**|\n     \n\n    >**Note**: Wait for the Remote Desktop session to open and Server Manager to load.\n\n    >**Note**: You will now map drive Z to an Azure File share within the Remote Desktop session to a Windows Server 2022 computer\n\n5. Within the Remote Desktop session to **myVMPrivate**, click **Start** and then click **Windows PowerShell ISE**.\n\n6. Within the **Windows PowerShell ISE** window, open the **Script** pane, then paste and run the PowerShell script that you recorded earlier in this lab. The script has the following format:\n\n    ```powershell\n    $connectTestResult = Test-NetConnection -ComputerName <storage_account_name>.file.core.windows.net -Port 445\n    if ($connectTestResult.TcpTestSucceeded) {\n       # Save the password so the drive will persist on reboot\n       cmd.exe /C \"cmdkey /add:`\"<storage_account_name>.file.core.windows.net`\" /user:`\"localhost\\<storage_account_name>`\"  /pass:`\"<storage_account_key>`\"\"\n       # Mount the drive\n       New-PSDrive -Name Z -PSProvider FileSystem -Root \"\\\\<storage_account_name>.file.core.windows.net\\my-file-share\" -Persist\n    } else {\n       Write-Error -Message \"Unable to reach the Azure storage account via port 445. Check to make sure your organization or ISP is not blocking port 445, or use Azure P2S VPN, Azure S2S VPN, or Express Route to tunnel SMB traffic over a different port.\"\n    }\n    ```\n    >**Note**: The `<storage_account_name>` placeholder represents the name of the storage account hosting the file share and `<storage_account_key>` one its primary key\n\n7. Start File Explorer and verify that the Z: drive mapping has been successfully created.\n\n8. Next, from the console pane of the **Windows PowerShell ISE** console, run the following to verify that the virtual machine has no outbound connectivity to the internet:\n\n    ```powershell\n    Test-NetConnection -ComputerName www.bing.com -Port 80\n    ```\n\n    >**Note**: The test will fail because the network security group associated with the Private subnet does not allow outbound access to the internet.\n\n9. Terminate the Remote Desktop session to the **myVMPrivate** Azure VM.\n\n    >**Note**: At this point, you have confirmed that the virtual machine in the Private subnet can access the storage account. \n\n####  Task 8: Test the storage connection from the public subnet to confirm that access is denied \n\n1. Navigate back to the **Virtual machines** blade. \n\n2. On the **Virtual machines** blade, click the **myVMPublic** entry.\n\n3. On the **myVMPublic** blade, click **Connect** and, in the drop down menu, click **Connect**. \n\n4. Click **Connect via RDP** and use it to connect to the **myVMPublic** Azure VM via Remote Desktop. When prompted to authenticate, provide the following credentials:\n\n    |Setting|Value|\n    |---|---|\n    |Username|**Student**|\n    |Password|**Please use your personal password created in Lab 02 > Exercise 2 > Task 1 > Step 3.**|\n\n\n    >**Note**: Wait for the Remote Desktop session to open and Server Manager to load.\n\n    >**Note**: You will now map drive Z to an Azure File share within the Remote Desktop session to a Windows Server 2022 computer\n\n5. Within the Remote Desktop session to **myVMPublic**, click **Start** and then click **Windows PowerShell ISE**.\n\n6. Within the **Windows PowerShell ISE** window, open the **Script** pane, then paste and run the same PowerShell script that you ran within the Remote Desktop session to the **myVMPrivate** Azure VM.\n\n    >**Note**: This time, you will receive the **New-PSDrive : Access is denied** error. \n\n    >**Note**: Access is denied because the *myVmPublic* virtual machine is deployed in the Public subnet. The Public subnet does not have a service endpoint enabled for the Azure Storage. The storage account only allows network access from the Private subnet.\n\n7. Next, from the console pane of the **Windows PowerShell ISE** console, run the following to verify that the virtual machine has outbound connectivity to the internet: \n\n    ```powershell\n    Test-NetConnection -ComputerName www.bing.com -Port 80\n    ```\n\n    >**Note**: The test will succeed because there is no outbound security rule to deny internet on the Public subnet.\n\n8. Terminate the Remote Desktop session to the **myVMPublic** Azure VM.\n\n    >**Note**: At this point, you have confirmed that the virtual machine in the Public subnet cannot access the storage account, but has access to the internet.\n\n\n**Clean up resources**\n\n> Remember to remove any newly created Azure resources that you no longer use. Removing unused resources ensures you will not incur unexpected costs. \n"}, {"file": "LAB_07_KeyVaultImplementingSecureDatabysettingupAlwaysEncrypted.md", "num": 7, "title": "07 - Key Vault (Implementing Secure Data by setting up Always Encrypted)", "module": "Module 01 - Implement and manage enforcement of cloud governance policies", "body": "# Lab 07: Key Vault (Implementing Secure Data by setting up Always Encrypted)\n\n# Student lab manual\n\n## Lab scenario\n\nYou have been asked to create a proof of concept application that makes use of the Azure SQL Database support for Always Encrypted functionality. All of the secrets and keys used in this scenario should be stored in Key Vault. The application should be registered in Microsoft Entra ID in order to enhance its security posture. To accomplish these objectives, the proof of concept should include:\n\n- Creating an Azure Key Vault and storing keys and secrets in the vault.\n- Create a SQL Database and encrypting content of columns in database tables by using Always Encrypted.\n\n>**Note**: For all the resources in this lab, we are using the **East US** region. Verify with your instructor this is the region to use for class. \n\nTo keep the focus on the security aspects of Azure, related to building this proof of concept, you will start from an automated ARM template deployment, setting up a Virtual Machine with Visual Studio and SQL Server Management Studio.\n\n## Lab objectives\n\nIn this lab, you will complete the following exercises:\n\n- Exercise 1: Deploy the base infrastructure from an ARM template\n- Exercise 2: Configure the Key Vault resource with a key and a secret\n- Exercise 3: Configure an Azure SQL database and a data-driven application\n- Exercise 4: Demonstrate the use of Azure Key Vault in encrypting the Azure SQL database\n\n## Key Vault diagram\n\n![Diagram showing the process flow of tasks in this lab.](media/key-vault-diagram.png)\n\n## Instructions\n\n## Lab files:\n\n- **\\\\Allfiles\\\\Labs\\\\10\\\\az-500-10_baseinfra.json**\n\n- **\\\\Allfiles\\\\Labs\\\\10\\\\program.cs**\n\n### Total Lab Time estimate: 60 minutes\n\n### Exercise 1: Deploy the base infrastructure from an ARM template\n\nIn this exercise, you will complete the following tasks:\n\n- Task 1: Deploy an Azure VM and an Azure SQL database\n\n#### Task 1: Deploy an Azure VM and an Azure SQL database\n\nIn this task, you will deploy an Azure VM, which will automatically install Visual Studio and SQL Server Management Studio as part of the deployment. \n\n1. Sign-in to the Azure portal **`https://portal.azure.com/`**.\n\n    >**Note**: Sign in to the Azure portal using an account that has the Owner or Contributor role in the Azure subscription you are using for this lab.\n\n2. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Deploy a custom template** and press the **Enter** key.\n\n3. On the **Custom deployment** blade, click the **Build your own template in the editor** option.\n\n4. On the **Edit template** blade, click **Load file**, locate the **\\\\Allfiles\\\\Labs\\\\10\\\\az-500-10_baseinfra.json** file and click **Open**.\n\n5. On the **Edit template** blade, click **Save**.\n\n6. On the **Custom deployment** blade, under **Deployment Scope** ensure that the following settings are configured (leave any others with their default values):\n\n   |Setting|Value|\n   |---|---|\n   |Subscription|the name of the Azure subscription you will be using in this lab|\n   |Resource group|click **Create new** and type the name **AZ500Lab10-lod@lab.LabInstance.Id**|\n   |Location|**East US**|\n   |Username|**Student**|\n   |Password|**Please use your personal password created in Lab 02 > Exercise 2 > Task 1 > Step 3.**|\n   \n    >**Note**: While you can change the administrative credentials used for logging on to the Virtual Machine, you don't have to.\n\n    >**Note**: To identify Azure regions where you can provision Azure VMs, refer to [**https://azure.microsoft.com/en-us/regions/offers/**](https://azure.microsoft.com/en-us/regions/offers/)\n\n7. Click the **Review and Create** button and confirm the deployment by clicking the **Create** button. \n\n    >**Note**: This initiates the deployment of the Azure VM and Azure SQL Database required for this lab. \n\n    >**Note**: Do not wait for the ARM template deployment to be completed, but instead continue to the next exercise. The deployment might take between **20-25 minutes**. \n\n#### Install the az500-10-DB.json Custom Template\n\n1. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Deploy a custom template** and press the **Enter** key.\n\n2. On the **Custom deployment** blade, click the **Build your own template in the editor** option.\n\n3. On the **Edit template** blade, click **Load file**, locate the **\\Allfiles\\Labs\\10\\az-500-10_DB.json** file and click **Open**.\n\n4. Ensure the correct Resource Group is selected.\n\n5. Set the **Admin Password** to the same password you used for the previous step.\n   \n6.  Click the **Review and Create** button and confirm the deployment by clicking the **Create** button.\n\n### Exercise 2: Configure the Key Vault resource with a key and a secret\n\n>**Note**: For all the resources in this lab, we are using the **East (US)** region. Verify with your instructor this is the region to use for your class. \n\nIn this exercise, you will complete the following tasks:\n\n- Task 1: Create and configure a Key Vault\n- Task 2: Add a key to the Key Vault\n- Task 3: Add a secret to the Key Vault\n\n#### Task 1: Create and configure a Key Vault\n\nIn this task, you will create an Azure Key Vault resource. You will also configure the Azure Key Vault permissions.\n\n1. Open the Cloud Shell by clicking the first icon (next to the search bar) at the top right of the Azure portal. If prompted, select **PowerShell** and **Create storage**.\n\n2. Ensure **PowerShell** is selected in the drop-down menu in the upper-left corner of the Cloud Shell pane.\n\n3. In the PowerShell session within the Cloud Shell pane, run the following to create an Azure Key Vault in the resource group **AZ500Lab10-lod@lab.LabInstance.Id**. (If you chose another name for this lab's Resource Group out of Task 1, use that name for this task as well). The Key Vault name must be unique. Remember the name you have chosen. You will need it throughout this lab.  \n\n    ```powershell\n    $kvName = 'az500kv' + $(Get-Random)\n\n    $location = (Get-AzResourceGroup -ResourceGroupName 'AZ500Lab10-lod@lab.LabInstance.Id').Location\n\n    New-AzKeyVault -VaultName $kvName -ResourceGroupName 'AZ500Lab10-lod@lab.LabInstance.Id' -Location $location -DisableRbacAuthorization\n    ```\n\n    >**Note**: The output of the last command will display the vault name and the vault URI. The vault URI is in the format `https://<vault_name>.vault.azure.net/`\n\n4. Close the Cloud Shell pane. \n\n5. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Resource groups** and press the **Enter** key.\n\n6. On the **Resource groups** blade, in the list of resource group, click the **AZ500Lab10-lod@lab.LabInstance.Id** (or other name you chose earlier for the resource group) entry.\n\n7. On the Resource Group blade, click the entry representing the newly created Key Vault. \n\n8. On the Key Vault blade, in the **Overview** section, click **Access Policies** and then click **+ Create**.\n\n9. On the **Create an access policy** blade, specify the following settings (leave all others with their default values): \n\n    |Setting|Value|\n    |----|----|\n    |Configure from template (optional)|**Key, Secret, & Certificate Management**|\n    |Key permissions|click **Select all** resulting in total of **9 selected** permissions|\n    |Key permissions/Cryptographic Operations|click **Sign** resulting in total of **1 selected** permissions|\n    |Secret permissions|click **Select all** resulting in total of **7 selected** permissions|\n    |Certification permissions|click **Select all** resulting in total of **15 selected** permissions|\n    |Select principal|On the **Principal** blade, select your user account, and click **Next**|\n    |Application (optional)|click **Next**|\n    |Review + create|click **Create**|\n    \n    >**Note**: The previous Review + create operation returns to the Access policies page that lists Application, Email, Key Permissions, Secret Permissions, and Certificate Permissions.\n      \n#### Task 2: Add a key to Key Vault\n\nIn this task, you will add a key to the Key Vault and view information about the key. \n\n1. In the Azure portal, open a PowerShell session in the Cloud Shell pane.\n\n2. Ensure **PowerShell** is selected in the upper-left drop-down menu of the Cloud Shell pane.\n\n3. In the PowerShell session within the Cloud Shell pane, run the following to add a software-protected key to the Key Vault: \n\n    ```powershell\n    $kv = Get-AzKeyVault -ResourceGroupName 'AZ500Lab10-lod@lab.LabInstance.Id'\n\n    $key = Add-AZKeyVaultKey -VaultName $kv.VaultName -Name 'MyLabKey' -Destination 'Software'\n    ```\n\n    >**Note**: The name of the key is **MyLabKey**\n\n4. In the PowerShell session within the Cloud Shell pane, run the following to verify the key was created:\n\n    ```powershell\n    Get-AZKeyVaultKey -VaultName $kv.VaultName\n    ```\n\n5. In the PowerShell session within the Cloud Shell pane, run the following to display the key identifier:\n\n    ```powershell\n    $key.key.kid\n    ```\n\n6. Minimize the Cloud Shell pane. \n\n7. Back in the Azure portal, on the Key Vault blade, in the **Objects** section, click **Keys**.\n\n8. In the list of keys, click the **MyLabKey** entry and then, on the **MyLabKey** blade, click the entry representing the current version of the key.\n\n    >**Note**: Examine the information about the key you created.\n\n    >**Note**: You can reference any key by using the key identifier. To get the most current version, reference `https://<key_vault_name>.vault.azure.net/keys/MyLabKey` or get the specific version with: `https://<key_vault_name>.vault.azure.net/keys/MyLabKey/<key_version>`\n\n\n#### Task 3: Add a Secret to Key Vault\n\n1. Switch back to the Cloud Shell pane.\n\n2. In the PowerShell session within the Cloud Shell pane, run the following to create a variable with a secure string value:\n\n    ```powershell\n    $secretvalue = ConvertTo-SecureString 'Pa55w.rd1234' -AsPlainText -Force\n    ```\n\n3.  In the PowerShell session within the Cloud Shell pane, run the following to add the secret to the vault:\n\n    ```powershell\n    $secret = Set-AZKeyVaultSecret -VaultName $kv.VaultName -Name 'SQLPassword' -SecretValue $secretvalue\n    ```\n\n    >**Note**: The name of the secret is SQLPassword. \n\n4.  In the PowerShell session within the Cloud Shell pane, run the following to verify the secret was created.\n\n    ```powershell\n    Get-AZKeyVaultSecret -VaultName $kv.VaultName\n    ```\n\n5. Minimize the Cloud Shell pane. \n\n6. In the Azure portal, navigate back to the Key Vault blade, in the **Objects** section, click **Secrets**.\n\n7. In the list of secrets, click the **SQLPassword** entry and then, on the **SQLPassword** blade, click the entry representing the current version of the secret.\n\n    >**Note**: Examine the information about the secret you created.\n\n    >**Note**: To get the most current version of a secret, reference `https://<key_vault_name>.vault.azure.net/secrets/<secret_name>` or get a specific version, reference `https://<key_vault_name>.vault.azure.net/secrets/<secret_name>/<secret_version>`\n\n\n### Exercise 3: Configure an Azure SQL database and a data-driven application\n\nIn this exercise, you will complete the following tasks:\n\n- Task 1: Enable a client application to access the Azure SQL Database service.\n- Task 2: Create a policy allowing the application access to the Key Vault.\n- Task 3: Retrieve SQL Azure database ADO.NET Connection String \n- Task 4: Log on to the Azure VM running Visual Studio 2019 and SQL Management Studio 19\n- Task 5: Create a table in the SQL Database and select data columns for encryption\n\n\n#### Task 1: Enable a client application to access the Azure SQL Database service. \n\nIn this task, you will enable a client application to access the Azure SQL Database service. This will be done by setting up the required authentication and acquiring the Application ID and Secret that you will need to authenticate your application.\n\n1. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **App Registrations** and press the **Enter** key.\n\n2. On the **App Registrations** blade, click **+ New registration**. \n\n3. On the **Register an application** blade, specify the following settings (leave all others with their default values):\n\n    |Setting|Value|\n    |----|----|\n    |Name|**sqlApp**|\n    |Redirect URI (optional)|**Web** and **https://sqlapp**|\n\n4. On the **Register an application** blade, click **Register**. \n\n    >**Note**: Once the registration is completed, the browser will automatically redirect you to **sqlApp** blade. \n\n5. On the **sqlApp** blade, identify the value of **Application (client) ID**. \n\n    >**Note**: Record this value. You will need it in the next task.\n\n6. On the **sqlApp** blade, in the **Manage** section, click **Certificates & secrets**.\n\n7. On the **sqlApp | Certificates & secrets** blade / **Client Secrets** section, click **+ New client secret**\n\n8. In the **Add a client secret** pane, specify the following settings:\n\n    |Setting|Value|\n    |----|----|\n    |Description|**Key1**|\n    |Expires|**12 months**|\n\t\n9. Click **Add** to update the application credentials.\n\n10. On the **sqlApp | Certificates & secrets** blade, identify the value of **Key1**.\n\n    >**Note**: Record this value. You will need it in the next task. \n\n    >**Note**: Make sure to copy the value *before* you navigate away from the blade. Once you do, it is no longer possible to retrieve its clear text value.\n\n\n#### Task 2: Create a policy allowing the application access to the Key Vault.\n\nIn this task, you will grant the newly registered app permissions to access secrets stored in the Key Vault.\n\n1. In the Azure portal, open a PowerShell session in the Cloud Shell pane.\n\n2. Ensure **PowerShell** is selected in the upper-left drop-down menu of the Cloud Shell pane.\n\n3. In the PowerShell session within the Cloud Shell pane, run the following to create a variable storing the **Application (client) ID** you recorded in the previous task (replace the `<Azure_AD_Application_ID>` placeholder with the value of the **Application (client) ID**):\n   \n    ```powershell\n    $applicationId = '<Azure_AD_Application_ID>'\n    ```\n4. In the PowerShell session within the Cloud Shell pane, run the following to create a variable storing the Key Vault name.\n\t```\n    $kvName = (Get-AzKeyVault -ResourceGroupName 'AZ500Lab10-lod@lab.LabInstance.Id').VaultName\n\n    $kvName\n    ```\n\n5. In the PowerShell session within the Cloud Shell pane, run the following to grant permissions on the Key Vault to the application you registered in the previous task:\n\n    ```powershell\n    Set-AZKeyVaultAccessPolicy -VaultName $kvName -ResourceGroupName AZ500Lab10-lod@lab.LabInstance.Id -ServicePrincipalName $applicationId -PermissionsToKeys get,wrapKey,unwrapKey,sign,verify,list\n    ```\n\n6. Close the Cloud Shell pane. \n\n\n#### Task 3: Retrieve SQL Azure database ADO.NET Connection String \n\nThe ARM-template deployment in Exercise 1 provisioned an Azure SQL Server instance and an Azure SQL database named **medical** . You will update the empty database resource with a new table structure and select data columns for encryption\n\n1. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **SQL databases** and press the **Enter** key.\n\n2. In the list of SQL databases, click the **medical(<randomsqlservername>)** entry.\n\n    >**Note**: If the database cannot be found, this likely means the deployment you initiated in Exercise 1 has not completed yet. You can validate this by browsing to the Azure Resource Group \"AZ500Lab10-lod@lab.LabInstance.Id\" (or the name you chose), and selecting **Deployments** from the Settings pane.  \n\n3. On the SQL database blade, in the **Settings** section, click **Connection strings**. \n\n    >**Note**: The interface includes connection strings for ADO.NET, JDBC, ODBC, PHP, and Go. \n   \n4. Record the **ADO.NET (SQL authentication)** connection string. You will need it later.\n\n    >**Note**: When you use the connection string, make sure to replace the `{your_password}` placeholder with the password that you configured with the deployment in Exercise 1.\n\n#### Task 4: Log on to the Azure VM running Visual Studio 2019 and SQL Management Studio 19\n\nIn this task, you log on to the Azure VM, which deployment you initiated in Exercise 1. This Azure VM hosts Visual Studio 2019 and SQL Server Management Studio 19.\n\n    >**Note**: Before you proceed with this task, ensure that the deployment you initiated in the first exercise has completed successfully. You can validate this by navigating to the blade of the Azure resource group \"AZ500Lab10-lod@lab.LabInstance.Id\" (or other name you chose) and selecting **Deployments** from the Settings pane.  \n\n1. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **virtual machines** and press the **Enter** key.\n\n2. In the list of Virtual Machines shown, select the **az500-10-vm1** entry. On the **az500-10-vm1** blade, on the **Essentials** pane, take note of the **Public IP address**. You will use this later. \n\n#### Task 5: Create a table in the SQL Database and select data columns for encryption\n\nIn this task, you will connect to the SQL Database with SQL Server Management Studio and create a table. You will then encrypt two data columns using an autogenerated key from the Azure Key Vault. \n\n1. In the Azure portal, navigate to the blade of the **medical** SQL database, in the **Essentials** section, identify the **Server name** (copy to clipboard), and then, in the toolbar, click **Set server firewall**.  \n\n    >**Note**: Record the server name. You will need the server name later in this task.\n\n2. On the **Firewall settings** blade, scroll down to Rule Name, click **+ Add a firewall rule**, and specify the following settings: \n\n    |Setting|Value|\n    |---|---|\n    |Rule Name|**Allow Mgmt VM**|\n    |Start IP|the Public IP Address of the az500-10-vm1|\n    |End IP|the Public IP Address of the az500-10-vm1|\n\n3. Click **Save** to save the change and close the confirmation pane. \n\n    >**Note**: This modifies the server firewall settings, allowing connections to the medical database from the Azure VM's public IP address you deployed in this lab.\n\n4. Navigate back to the **az500-10-vm1** blade, click **Overview**, next click **Connect** and, in the drop down menu, click **Connect**. \n\n5. Download the RDP file and use it to connect to the **az500-10-vm1** Azure VM via Remote Desktop. When prompted to authenticate, provide the following credentials:\n\n    |Setting|Value|\n    |---|---|\n    |Username|**Student**|\n    |Password|**Please use your personal password created in Lab 02 > Exercise 1 > Task 1 > Step 9.**|\n    \n    >**Note**: Wait for the Remote Desktop session and **Server Manager** to load. Close Server Manager. \n\n    >**Note**: The remaining steps in this lab are performed within the Remote Desktop session to the **az500-10-vm1** Azure VM.\n\n6. Install [SQL Server Management Studio](https://learn.microsoft.com/en-us/sql/ssms/download-sql-server-management-studio-ssms?preserve-view=true&view=sql-server-2017) on **az500-10-vm1.** Azure VM.\n \n7. Open **SQL Server Management Studio.**\n\n8. In the **Connect to Server** dialog box, specify the following settings: \n\n    |Setting|Value|\n    |---|---|\n    |Server Type|**Database Engine**|\n    |Server Name|the server name you identified earlier in this task|\n    |Authentication|**SQL Server Authentication**|\n    |Username|**Student**|\n    |Password|**Please use your personal password created in Lab 02 > Exercise 2 > Task 1 > Step 3.**|\n\n9. In the **Connect to Server** dialog box, click **Connect**.\n\n10. Within the **SQL Server Management Studio** console, in the **Object Explorer** pane, expand the **Databases** folder.\n\n11. In the **Object Explorer** pane, right-click the **medical** database and click **New Query**.\n\n12. Paste the following code into the query window and click **Execute**. This will create a **Patients** table.\n\n     ```sql\n     CREATE TABLE [dbo].[Patients](\n\t\t[PatientId] [int] IDENTITY(1,1),\n\t\t[SSN] [char](11) NOT NULL,\n\t\t[FirstName] [nvarchar](50) NULL,\n\t\t[LastName] [nvarchar](50) NULL,\n\t\t[MiddleName] [nvarchar](50) NULL,\n\t\t[StreetAddress] [nvarchar](50) NULL,\n\t\t[City] [nvarchar](50) NULL,\n\t\t[ZipCode] [char](5) NULL,\n\t\t[State] [char](2) NULL,\n\t\t[BirthDate] [date] NOT NULL \n     PRIMARY KEY CLUSTERED ([PatientId] ASC) ON [PRIMARY] );\n     ```\n13. After the table is created successfully, in the **Object Explorer** pane, expand the **medical** database node, the **tables** node, right-click the **dbo.Patients** node, and click **Always Encrypted wizard...**. \n\n    >**Note**: This will initiate the **Always Encrypted** wizard.\n\n14. On the **Introduction** page, click **Next**.\n\n15. On the **Column Selection** page, select the **SSN** and **Birthdate** columns, set the **Encryption Type** of the **SSN** column to **Deterministic** and of the **Birthdate** column to **Randomized**, and click **Next**.\n\n    >**Note**: While performing the encryption if any error thrown like **Exception has been thrown by the target of an invocation** related to **Rotary(Microsoft.SQLServer.Management.ServiceManagement)** then make sure the **Key Permission's** values of **Rotation Policy Operations** are **unchecked**, if not in the Azure portal navigate to the **Key Vault** >> **Access Policies** >> **Key Permissions** >> Uncheck all the values under the **Rotation Policy Operations** >> Under **Privileged Key Operations** >> Uncheck **Release**.\n\n16. On the **Master Key Configuration** page, select **Azure Key Vault**, click **Sign in**. Make sure to only allow this App to sign in. When prompted, authenticate by using the same user account you used to provision the Azure Key Vault instance earlier in this lab, ensure that that Key Vault appears in the **Select an Azure Key Vault** drop down list, and click **Next**.\n\n17. On the **Run Settings** page, click **Next**.\n\t\n18. On the **Summary** page, click **Finish** to proceed with the encryption. When prompted, sign in again by using the same user account you used to provision the Azure Key Vault instance earlier in this lab.\n\n19. Once the encryption process is complete, on the **Results** page, click **Close**.\n\n20. In the **SQL Server Management Studio** console, in the **Object Explorer** pane, under the **medical** node, expand the **Security** and **Always Encrypted Keys** subnodes. \n\n    >**Note**: The **Always Encrypted Keys** subnode contains the **Column Master Keys** and **Column Encryption Keys** subfolders.\n\n### Exercise 4: Demonstrate the use of Azure Key Vault in encrypting the Azure SQL database\n\nIn this exercise, you will complete the following tasks:\n\n- Task 1: Install Visual Studio 2026\n- Task 2: Run a data-driven application to demonstrate the use of Azure Key Vault in encrypting the Azure SQL database\n\n#### Task 1: Install Visual Studio 2026\n\n1. Switch to your Server virtual machine if you are not already there.\n\n2. Open Server Manager.\n\n3. Select Local Servers.\n\n4. Set **IE Enhanced Security Configuration** to **Off**.\n\n5. Open the Browser and bypass the warning about IE ESC being turned off.\n\n6. Go to https://visualstudio.microsoft.com/downloads.\n\n7. In the **Visual Studio 2026** box, under **Community** select **Free download**.\n\n8. When the download finishes, select **Open File**.\n\n9. Select continue to start the install.\n  - Install takes about 10 minutes\n\n10. Choose **.Net Desktop Development** in the Workloads screen.\n\n#### Task 2: Run a data-driven application to demonstrate the use of Azure Key Vault in encrypting the Azure SQL database\n\nYou will create a Console application using Visual Studio to load data into the encrypted columns and then access that data securely using a connection string that accesses the key in the Key Vault.\n\n1. From the RDP session to the **az500-10-vm1**, launch **Visual Studio 2026** from the **Start menu**.\n\n2. Switch to the window displaying Visual Studio 2026 welcome message, click the **Sign in** button and, when prompted, provide the credentials you used to authenticate to the Azure subscription you are using in this lab.\n\n3. On the **Get started** page, click **Create a new project**. \n\n4. In the list of project templates, search for **Console App (.NET Framework)**, in the list of results, click **Console App (.NET Framework)** for **C#**, and click **Next**.\n\n5. On the **Configure your new project** page, specify the following settings (leave other settings with their default values), then click **Create**:\n\n    |Setting|Value|\n    |---|---|\n    |Project name|**OpsEncrypt**|\n    |Solution name|**OpsEncrypt**|\n    |Framework|**.NET Framework 4.7.2**|\n\n6. In the Visual Studio console, click the **Tools** menu, in the drop down menu, click **NuGet Package Manager**, and, in the cascading menu, click **Package Manager Console**.\n\n7. In the **Package Manager Console** pane, run the following to install the first required **NuGet** package:\n\n    ```powershell\n    Install-Package Microsoft.SqlServer.Management.AlwaysEncrypted.AzureKeyVaultProvider\n    ```\n\n8. In the **Package Manager Console** pane, run the following to install the second required **NuGet** package:\n\n    ```powershell\n    Install-Package Microsoft.IdentityModel.Clients.ActiveDirectory\n    ```\n    \n9. Minimize the RDP session to your Azure virtual machine, then navigate to **\\\\Allfiles\\\\Labs\\\\10\\\\program.cs**, open it in Notepad, and copy its content into Clipboard.\n\n10. Return to the RDP session, and in the Visual Studio console, in the **Solution Explorer** window, click **Program.cs** and replace its content with the code you copied into Clipboard.\n\n11. In the Visual Studio window, in the **Program.cs** pane, in line 15, replace the `<connection string noted earlier>` placeholder with the Azure SQL database **ADO.NET** connection string you recorded earlier in the lab. In the connection string, replace the `{your_password}` placeholder, with the password that you specified in the deployment in Exercise 1. If you saved the string on the lab computer, you may need to leave the RDP session to copy the ADO string, then return to the Azure virtual machine to paste it in.\n\n12. In the Visual Studio window, in the **Program.cs** pane, in line 16, replace the `<client id noted earlier>` placeholder with the value of **Application (client) ID** of the registered app you recorded earlier in the lab. \n\n13. In the Visual Studio window, in the **Program.cs** pane, in line 17, replace the `<key value noted earlier>` placeholder with the the value of **Key1** of the registered app you recorded earlier in the lab. \n\n14. In the Visual Studio console, click the **Start** button to initiate the build of the console application and start it.\n\n15. The application will start a Command Prompt window. When prompted for password, type the password that you specified in the deployment in Exercise 1 to connect to Azure SQL Database. \n\n16. Leave the console app running and switch to the **SQL Management Studio** console. \n\n17. In the **Object Explorer** pane, right-click the **medical database** and, in the right-click menu, click **New Query**.\n\n18. From the query window, run the following query to verify that the data that loaded into the database from the console app is encrypted.\n\n    ```sql\n    SELECT FirstName, LastName, SSN, BirthDate FROM Patients;\n    ```\n\n19. Switch back to the console application where you are prompted to enter a valid SSN. This will query the encrypted column for the data. At the Command Prompt, type the following and press the Enter key:\n\n    ```cmd\n    999-99-0003\n    ```\n\n    >**Note**: Verify that the data returned by the query is not encrypted.\n\n20. To terminate the console app, press the Enter key\n\n**Clean up resources**\n\n> Remember to remove any newly created Azure resources that you no longer use. Removing unused resources ensures you will not incur unexpected costs.\n\n1. In the Azure portal, open the Cloud Shell by clicking the first icon in the top right of the Azure portal. \n\n2. In the upper-left drop-down menu of the Cloud Shell pane, if needed select **PowerShell** and, when prompted, click **Confirm**.\n\n3. In the PowerShell session within the Cloud Shell pane, run the following to remove the resource groups you created in this lab:\n  \n    ```powershell\n    Remove-AzResourceGroup -Name \"AZ500Lab10-lod@lab.LabInstance.Id\" -Force -AsJob\n    ```\n\n4.  Close the **Cloud Shell** pane. \n"}, {"file": "LAB_08_CreateaLogAnalyticsworkspaceAzureStorageAccountDataCollectionRule(DCR).md", "num": 8, "title": "08 - Create a Log Analytics Workspace, Azure Storage Account, and Data Collection Rule (DCR)", "module": "Module 03 - Configure and manage threat protection by using Microsoft Defender for Cloud", "body": "# Lab 08: Create a Log Analytics Workspace, Azure Storage Account, and Data Collection Rule (DCR)\n\n# Student lab manual\n\n## Lab scenario\n\nAs an Azure Security Engineer for a financial technology company, you are tasked with enhancing monitoring and security visibility across all Azure virtual machines (VMs) used for processing financial transactions and managing sensitive customer data. The security team requires detailed logs and performance metrics from these VMs to detect potential threats and optimize system performance. The Chief Information Security Officer (CISO) has asked you to implement a solution that collects security events, system logs, and performance counters. You have been assigned to configure the Azure Monitor Agent (AMA) along with Data Collection Rules (DCRs) to centralize log collection and performance monitoring.\n\n\n\n> For all the resources in this lab, we are using the **East US** region. Verify with your instructor this is the region to use for class. \n\n## Lab objectives\n\nIn this lab, you will complete the following exercises:\n\n- Exercise 1: Deploy an Azure virtual machine\n- Exercise 2: Create a Log Analytics workspace\n- Exercise 3: Create an Azure storage account\n- Exercise 4: Create a data collection rule\n  \n## Instructions\n\n### Exercise 1: Deploy an Azure virtual machine\n\n### Exercise timing: 10 minutes\n\nIn this exercise, you will complete the following tasks: \n\n#### Task 1: Deploy an Azure virtual machine\n\n1. Sign-in to the Azure portal **`https://portal.azure.com/`**.\n\n    >**Note**: Sign in to the Azure portal using an account that has the Owner or Contributor role in the Azure subscription you are using for this lab.\n\n2. Open the Cloud Shell by clicking the first icon in the top right of the Azure Portal. If prompted, select **PowerShell**.\n\n3. Ensure **PowerShell** is selected in the drop-down menu in the upper-left corner of the Cloud Shell pane.\n\n4. In the **Getting started** window, leave the default setting as is: **Select a subscription to get started. You can optionally mount a storage account to persist files between sessions. No storage account required.**\n\n5. From the **Subscription** drop-down menu, select your **lodsubscription.**\n\n6. Leave **Use an existing private virtual network** unchecked, then click **Apply.**\n\n7. In the PowerShell session within the Cloud Shell pane, run the following to create a resource group that will be used in this lab:\n  \n    ```powershell\n    New-AzResourceGroup -Name AZ500LAB131415 -Location 'EastUS'\n    ```\n\n    >**Note**: This resource group will be used for labs 8, 9, and 10.\n\n8. In the PowerShell session within the Cloud Shell pane, run the following to enable encryption at host (EAH)\n   \n   ```powershell\n    Register-AzProviderFeature -FeatureName \"EncryptionAtHost\" -ProviderNamespace Microsoft.Compute \n    ```\n\n5. In the PowerShell session within the Cloud Shell pane, run the following to create a new Azure virtual machine. \n\n    ```powershell\n    New-AzVm -ResourceGroupName \"AZ500LAB131415\" -Name \"myVM\" -Location 'EastUS' -VirtualNetworkName \"myVnet\" -SubnetName \"mySubnet\" -SecurityGroupName   \"myNetworkSecurityGroup\" -PublicIpAddressName \"myPublicIpAddress\" -PublicIpSku Standard -OpenPorts 80,3389 -Size Standard_D2_v4 \n    ```\n    \n6.  When prompted for credentials:\n\n    |Setting|Value|\n    |---|---|\n    |User |**localadmin**|\n    |Password|**Please use your personal password created in Lab 02 > Exercise 2 > Task 1 > Step 3.**|\n\n    >**Note**: Wait for the deployment to complete. \n\n7. In the PowerShell session within the Cloud Shell pane, run the following to confirm that the virtual machine named **myVM** was created and its **ProvisioningState** is **Succeeded**.\n\n    ```powershell\n    Get-AzVM -Name 'myVM' -ResourceGroupName 'AZ500LAB131415' | Format-Table\n    ```\n\n8. Close the Cloud Shell pane. \n\n### Exercise 2: Create an Log Analytics workspace\n\n### Exercise timing: 10 minutes\n\nIn this exercise, you will complete the following tasks: \n\n#### Task 1: Create a Log Analytics workspace\n\nIn this task, you will create a Log Analytics workspace. \n\n1. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Log Analytics workspaces** and press the **Enter** key.\n\n2. On the **Log Analytics workspaces** blade, click **+ Create**.\n\n3. On the **Basics** tab of the **Create Log Analytics workspace** blade, specify the following settings (leave others with their default values):\n\n    |Setting|Value|\n    |---|---|\n    |Subscription|the name of the Azure subscription you are using in this lab|\n    |Resource group|**AZ500LAB131415**|\n    |Name|**lgawIgnite**|\n    |Region|**East US**|\n\n4. Select **Review + create**.\n\n5. On the **Review + create** tab of the **Create Log Analytics workspace** blade, select **Create**.\n\n### Exercise 3: Create an Azure storage account\n\n### Estimated timing: 10 minutes\n\nIn this exercise, you will complete the following tasks:\n\n#### Task 1: Create an Azure storage account\n\nIn this task, you will create a storage account.\n\n1. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Storage accounts** and press the **Enter** key.\n\n2. On the **Storage accounts** blade in the Azure portal, click the **+ Create** button to create a new storage account.\n\n3. On the **Basics** tab of the **Create storage account** blade, specify the following settings (leave others with their default values):\n\n    |Setting|Value|\n    |---|---|\n    |Subscription|the name of the Azure subscription you are using in this lab|\n    |Resource group|**AZ500LAB131415**|\n    **Instance details**\n    |Storage account name|**strgactignite@lab.LabInstance.Id**|\n    |Region|**(US) EastUS**|\n    |Primary service|**Azure Blob Storage or Azure Data Lake Storage Gen 2**|\n    |Performance|**Standard (general-purpose v2 account)**|\n    |Redundancy|**Locally redundant storage (LRS)**|\n\n5. On the **Basics** tab of the **Create storage account** blade, click **Review + create.** After the validation process completes, click **Create.**\n\n    >**Note**: Wait for the Storage account to be created. This should take about 2 minutes.\n\n### Exercise 4: Create a Data Collection Rule\n\n### Estimated timing: 15 minutes\n\nIn this exercise, you will complete the following tasks:\n\n#### Task 1: Create a Data Collection Rule.\n\nIn this task, you will create a data collection rule.\n\n1. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Monitor** and press the **Enter** key.\n\n2. On the **Monitor Settings** blade, click **Data Collection Rules.**\n\n3. Click the **+ Create** button to create a new data collection rule.\n\n4. On the **Basics** tab of the **Create Data Collection Rule** blade, specify the following settings:\n  \n    |Setting|Value|\n    |---|---|\n    **Rule details**\n    |Rule Name|**DCR1**|\n    |Subscription|the name of the Azure subscription you are using in this lab|\n    |Resource Group|**AZ500LAB131415**|\n    |Region|**East US**|\n    |Platform Type|**Windows**|\n    |Data Collection Endpoint|*Leave Blank*|\n\n    ![Screen capture of the Create Data Collection Rule basics tab.](media/crete-a-data-collection-rule-basics-tab.png)\n\n\n5. Click on the button labeled **Next: Resources >** to proceed.\n   \n6. On the **Resources** page, select + **Add resources.**\n\n7. In the **Select a scope** template, check the **Subscription** box in the **Scope.**\n\n8. At the bottom of the **Select a scope** template, click **Apply.**\n\n9. At the bottom of the **Resources** page, select **Next: Collect and deliver >.**\n\n10. Click **+ Add data source**, then on the **Add data source** page, change the **Data source type** drop-down menu to display **Performance Counters.** Leave the following default settings:\n\n    |Setting|Value|\n    |---|---|\n    |**Performance counter**|**Sample rate (seconds)**|\n    |CPU|60|\n    |Memory|60|\n    |Disk|60|\n    |Network|60|\n\n   ![Screen capture of the Collect and Deliver tab of the Data Collection Rule.](media/crete-a-data-collection-rule-collectanddeliver-tab.png)\n\n11. Click on the button labeled **Next: Destination >** to proceed.\n  \n12. Click **+ Add destination**, change the **Destination type** drop-down menu to display **Azure Monitor Logs.** In the **Subscription** window, ensure that your *Subscription* is displayed, then change the **Account or namespace** drop-down menu to reflect your previously created Log Analytics Workspace.\n\n13. Click on **Add data source** at the bottom of the page.\n    \n    ![Screen capture of the Add a Data Source page on the Data Collction Rule page.](media/crete-a-data-collection-rule-add-datasource.png)\n\n14. Click **Review + create.**\n\n    ![Screen capture of the Review + Create tab of the Data Collection Rule wizard.](media/crete-a-data-collection-rule-reviewcreate-tab.png)\n\n15. Click **Create.**\n\n> Results: You deployed an Azure virtual machine, Log Analytics workspace, Azure storage account, and a data collection rule to collect events and performance counters from virtual machines with Azure Monitor Agent.\n\n>**Note**: Do not remove the resources from this lab, as they are needed for the Microsoft Defender for Cloud lab, the 'Enable just-in-time access on VMs' lab, and the Microsoft Sentinel lab\n \n"}, {"file": "LAB_09_ConfiguringMicrosoftDefenderforCloudEnhancedSecurityFeaturesforServers.md", "num": 9, "title": "09 - Configuring Microsoft Defender for Cloud Enhanced Security Features for Servers", "module": "Module 03 - Configure and manage threat protection by using Microsoft Defender for Cloud", "body": "# Lab 09: Configuring Microsoft Defender for Cloud Enhanced Security Features for Servers\n\n# Student lab manual\n\n## Lab scenario\n\nAs an Azure Security Engineer for a global e-commerce company, you are responsible for securing the company’s cloud infrastructure. The organization relies heavily on Azure virtual machines (VMs) and on-premises servers to run critical applications, manage customer data, and process transactions. The Chief Information Security Officer (CISO) has identified the need for enhanced security measures to protect these resources against cyber threats, vulnerabilities, and misconfigurations. You have been tasked with enabling Microsoft Defender for Servers in Microsoft Defender for Cloud to provide advanced threat protection and security monitoring for both Azure VMs and hybrid servers.\n\n## Lab objectives\n\n- Configure Microsoft Defender for Cloud Enhanced Security Features for Servers\n  \n- Review the enhanced security features for Microsoft Defender for Servers Plan 2\n\n## Exercise instructions\n\n### Configure Microsoft Defender for Cloud Enhanced Security Features for Servers\n\n1. In the Azure portal, in the Search resources, services, and docs text box at the top of the Azure portal page, type **Microsoft Defender for Cloud** and press the **Enter** key.\n\n2. On the **Microsoft Defender for Cloud**, **Management blade**, go to the **Environment settings**. Expand the environment settings folders until the **subscription** section is displayed, then click the **subscription** to view details.\n\n   ![Screen capture of the Environment Settings of Microsoft Defender for Cloud](media/defender-for-cloud-environment-settings.png)\n   \n3. In the **Settings** blade, under **Defender plans**, expand **Cloud Workload Protection (CWPP)**.\n\n4. From the **Cloud Workload Protection (CWPP) Plan** list, select **Servers**. On the right side of the page, change the **Status** from **Off** to **On**, then click **Save**.\n\n5. To review the details of **Microsoft Defender for Servers Plan 2**, select **Change plan >**.\n\n   Note: Enabling the Cloud Workload Protection (CWPP) Servers plan from Off to On enables Microsoft Defender for Servers Plan 2.\n \n   ![Screen capture of the Microsoft Defender for Cloud plan selection page.](media/defender-for-cloud-plan-selection.png)\n   \n> **Results**: You have enabled Microsoft Defender for Servers Plan 2 on your subscription.\n"}, {"file": "LAB_10_Enable just-in-time access on VMs.md", "num": 10, "title": "10 - Enable just-in-time access on VMs", "module": "Module 03 - Configure and manage threat protection by using Microsoft Defender for Cloud", "body": "# Lab 10: Enable just-in-time access on VMs\n\n# Student lab manual\n\n## Lab scenario\n\nAs an Azure Security Engineer at a financial services company, you're responsible for securing Azure resources, including virtual machines (VMs) that host critical applications. The security team has identified that continuous open access to VMs increases the risk of brute-force attacks and unauthorized access. To mitigate this, the Chief Information Security Officer (CISO) has requested that you enable Just-in-Time (JIT) VM access on a specific Azure VM used for processing financial transactions.\n\n## Lab objectives\n\nIn this lab, you will complete the following exercises:\n\n- Exercise 1: Enable JIT on your VMs from the Azure portal.\n\n- Exercise 2: Request access to a VM that has JIT enabled from the Azure portal.\n\n## Exercise instructions \n\n### Exercise 1: Enable JIT on your VMs from Azure virtual machines\n\n>**Note**: You can enable JIT on a VM from the Azure virtual machines pages of the Azure portal.\n\n1. In the search box at the top of the portal, enter **virtual machines.** Select **Virtual machines** in the search results.\n\n2. Select **myVM.**\n \n3. Select **Configuration** from the **Settings** section of **myVM.**\n   \n4. Under **Just-in-time VM access,** select **Enable just-in-time.**\n\n5. Under **Just-in-time VM access,** click on the link that reads **Open Microsoft Defender for Cloud.**\n\n6. By default, just-in-time access for the VM uses these settings:\n\n   - Windows machines\n   \n     - RDP port: 3389\n     - Maximum allowed access: Three hours\n     - Allowed source IP addresses: Any\n\n   - Linux machines\n     - SSH port: 22\n     - Maximum allowed access: Three hours\n     - Allowed source IP addresses: Any\n   \n7. By default, just-in-time access for the VM uses these settings:\n\n   - From the **Configured** tab, right-click on the VM to which you want to add a port, and select edit.\n\n   ![Screen capture of the just-in-time access for vm configuration screen.](media/just-in-time-vm-access.png)\n   \n   - Under **JIT VM access configuration,** you can either edit the existing settings of an already protected port or add a new custom port.\n   - When you've finished editing the ports, select **Save.**   \n\n### Exercise 2: Request access to a JIT-enabled VM from the Azure virtual machine's connect page.\n\n>**Note**: When a VM has a JIT enabled, you have to request access to connect to it. You can request access in any of the supported ways, regardless of how you enabled JIT.\n   \n1. In the Azure portal, open the virtual machines pages.\n\n2. Select the VM to which you want to connect, and open the **Connect** page.\n\n   - Azure checks to see if JIT is enabled on that VM.\n\n        - If JIT isn't enabled for the VM, you're prompted to enable it.\n    \n        - If JIT is enabled, select **Request access** to pass an access request with the requesting IP, time range, and ports that were configured for that VM.\n    \n   ![Screen capture of the Connect to a Virtual Machine using JIT.](media/vm-connection-for-vm1.png)\n\n> **Results**: You have explored various methods on how to enable JIT on your VMs and how to request access to VMs that have JIT enabled in Microsoft Defender for Cloud.\n"}, {"file": "LAB_11_Microsoft Sentinel.md", "num": 11, "title": "11 - Microsoft Sentinel", "module": "Module 04 - Configure and manage security monitoring and automation solutions", "body": "# Lab 11: Microsoft Sentinel\n# Student lab manual\n\n## Lab scenario\n\n**Note:** **Azure Sentinel** is renamed to **Microsoft Sentinel** \n\nYou have been asked to create a proof of concept of Microsoft Sentinel-based threat detection and response. Specifically, you want to:\n\n- Start collecting data from Azure Activity and Microsoft Defender for Cloud.\n- Add built in and custom alerts \n- Review how Playbooks can be used to automate a response to an incident.\n\n> For all the resources in this lab, we are using the **East US** region. Verify with your instructor this is the region to use for class. \n\n## Lab objectives\n\nIn this lab, you will complete the following exercise:\n\n- Exercise 1: Implement Microsoft Sentinel\n\n## Microsoft Sentinel diagram\n\n![Diagram of the process flow of tasks for this lab.](media/microsoft-sentinel-diagram.png)\n\n## Instructions\n\n## Lab files:\n\n- **\\\\Allfiles\\\\Labs\\\\15\\\\changeincidentseverity.json**\n\n### Exercise 1: Implement Microsoft Sentinel\n\n### Estimated timing: 30 minutes\n\nIn this exercise, you will complete the following tasks:\n\n- Task 1: On-board Microsoft Sentinel\n- Task 2: Connect Azure Activity to Sentinel\n- Task 3: Create a rule that uses the Azure Activity data connector. \n- Task 4: Create a playbook\n- Task 5: Create a custom alert and configure the playbook as an automated response.\n- Task 6: Invoke an incident and review the associated actions.\n\n#### Task 1: On-board Microsoft Sentinel\n\nIn this task, you will on-board Microsoft Sentinel and connect the Log Analytics workspace. \n\n1. Sign-in to the Azure portal **`https://portal.azure.com/`**.\n\n    >**Note**: Sign in to the Azure portal using an account that has the Owner or Contributor role in the Azure subscription you are using for this lab.\n\n2. In the Azure portal, in the **Search resources, services, and docs** text box at the top of the Azure portal page, type **Microsoft Sentinel** and press the **Enter** key.\n\n    >**Note**: If this is your first attempt to action Microsoft Sentinel in the Azure dashboard complete the following step(s): In the Azure portal, in the **Search resources,  services, and docs** text box at the top of the Azure portal page, type **Microsoft Sentinel** and press the **Enter** key. Select **Microsoft Sentinel** from the **Services** view.\n  \n3. On the **Microsoft Sentinel** blade, click **+ Create**.\n\n4. On the **Add Microsoft Sentinel to a workspace** blade, select the Log Analytics workspace you created in the Azure Monitor lab and click **Add**.\n\n    >**Note**: Microsoft Sentinel has very specific requirements for workspaces. For example, workspaces created by Microsoft Defender for Cloud can not be used. Read more at [Quickstart: On-board Microsoft Sentinel](https://docs.microsoft.com/en-us/microsoft/sentinel/quickstart-onboard)\n\t\n#### Task 2: Configure Microsoft Sentinel to use the Azure Activity data connector. \n\nIn this task, you will configure Sentinel to use the Azure Activity data connector.  \n\n1. In the Azure portal, on the **Microsoft Sentinel \\| Overview** blade, in the **Content management** section, click **Content hub**.\n\n2. On the **Microsoft Sentinel \\| Content hub** blade, review the list of available content.\n\n3. Type **Azure** into the search bar and select the entry representing **Azure Activity**. Review its description at the far right, and then click **Install**.\n\n4. Wait for the **Install Success** notification. In the left navigation panel, in the **Configuration** section, click **Data connectors**.\n\n5. On the **Microsoft Sentinel \\| Data connectors** blade, click **Refresh** and review the list of available connectors. Select the entry representing the **Azure Activity** connector (hide the menu bar on the left using \\<< if needed), review its description and status at the far right, and then click **Open connector page**.\n\n6. On the **Azure Activity** blade the **Instructions** tab should be selected, note the **Prerequisites** and scroll down to the **Configuration**. Take note of the information describing the connector update. Your subscription never used the legacy connection method so you can skip step 1 (the **Disconnect All** button will be grayed out) and proceed to step 2.\n\n7. In step 2 **Connect your subscriptions through diagnostic settings new pipeline**, review the \"Launch the Azure Policy Assignment wizard and follow the steps\" instructions then click **Launch the Azure Policy Assignment wizard\\>**.\n\n8. On the **Configure Azure Activity logs to stream to specified Log Analytics workspace** (Assign Policy page) **Basics** tab, click the **Scope ellipsis (...)** button. In the **Scope** page choose your subscription from the drop-down subscription list and click the **Select** button at the bottom of the page.\n\n    >**Note**: *Do not* choose a Resource Group\n\n9. Click the **Next** button at the bottom
